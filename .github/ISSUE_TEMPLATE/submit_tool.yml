name: 🚀 Submit an Antigravity-Exclusive Tool
description: Suggest a 100% Google Antigravity-dedicated tool, IDE extension, runtime fix, or ACP gateway
title: "[Tool Submission]: "
labels: ["submission", "review-needed"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping curate **awesome-antigravity-tools**!
        **Strict Exclusivity Gate**: We ONLY accept open-source, executable tools built **100% specifically for Google Antigravity** (IDE, `agy` CLI, or `agy acp`). Generic prompt packs (`SKILL.md`) and multi-agent tools will be declined.

  - type: input
    id: tool_name
    attributes:
      label: Tool Name
      description: Display name of the project or extension.
      placeholder: e.g. vscode-antigravity-cockpit
    validations:
      required: true

  - type: input
    id: repo_url
    attributes:
      label: Repository / Project URL
      description: Public GitHub repository URL (`https://github.com/owner/repo`).
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the canonical catalog category.
      options:
        - "Official CLI & SDKs"
        - "IDE Extensions & Cockpits"
        - "Platform Fixes & Runtime Patches"
        - "Dedicated Gateways, ACP Adapters & Migration Tooling"
    validations:
      required: true

  - type: textarea
    id: description_en
    attributes:
      label: One-line Description (English)
      description: Objective one-line summary (15-240 chars, starts with a capital letter, ends with a period).
      placeholder: Zero-copy NTFS hardlink directory bridge resolving Go language server junction discovery failures on Windows.
    validations:
      required: true

  - type: textarea
    id: description_zh
    attributes:
      label: One-line Description (Chinese, Optional)
      description: 简明客观的中文一句话介绍（以中文句号“。”结尾，留空则由维护者补充）。
      placeholder: 零磁盘占用 NTFS 硬链接目录桥接工具，解决 Windows 目录联接无法被发现的问题。
    validations:
      required: false

  - type: textarea
    id: exclusivity_reason
    attributes:
      label: Antigravity Exclusivity Rationale
      description: Explain why this tool is built specifically for Google Antigravity rather than generic AI coding agents.
      placeholder: Built natively on Google Antigravity's official `agy acp` protocol over stdio.
    validations:
      required: true

  - type: input
    id: platforms
    attributes:
      label: Platforms
      description: "Comma-separated values from: Windows, macOS, Linux, Cross-Platform, VS Code, Antigravity IDE, Mobile, Web."
      placeholder: Windows, macOS, Linux
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: 1 to 5 concise comma-separated technical tags (e.g. Rust, ACP, Gateway).
      placeholder: Rust, GPUI, Gateway
    validations:
      required: true

  - type: input
    id: install_hint
    attributes:
      label: Install / Quick-Start Hint (Optional)
      description: Short install command or release instruction shown in the CLI and Web Explorer.
      placeholder: Download installer from GitHub Releases
    validations:
      required: false

  - type: checkboxes
    id: quality_checklist
    attributes:
      label: Quality & Exclusivity Verification
      options:
        - label: The project is 100% dedicated to Google Antigravity (not a generic cross-agent tool or bare `SKILL.md` prompt pack).
          required: true
        - label: The repository is public, contains real executable code, and has clear installation instructions.
          required: true
        - label: I have verified the tool works and does not return 404 or violate licensing terms.
          required: true
